name: trtripsathi_mobile
description: Mobile app for TRtripsathi (Flutter skeleton)
publish_to: 'none'
version: 0.1.0+1
environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  http: ^1.5.0
  flutter_secure_storage: ^8.0.0
  provider: ^6.0.5
  shared_preferences: ^2.5.3
  image_picker: ^1.1.2
  lottie: ^3.0.0
  firebase_core: ^4.2.1
  firebase_messaging: ^16.0.4
  flutter_map: ^8.3.1
  geolocator: ^13.0.4
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/animations/travel_orbit.json
