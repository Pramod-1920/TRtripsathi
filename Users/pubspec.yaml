name: trtripsathi_mobile
description: Mobile app for TRtripsathi (Flutter skeleton)
publish_to: 'none'
version: 0.1.0+1
environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.2
  http: ^1.5.0
  flutter_secure_storage: ^8.0.0
  provider: ^6.0.5
  shared_preferences: ^2.5.3
  image_picker: ^1.1.2
  image: ^4.5.4
  firebase_core: ^4.2.1
  firebase_messaging: ^16.0.4
  flutter_map: ^8.3.1
  geolocator: ^13.0.4
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/logo/app_icon.jpg"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo/app_icon.jpg"
  adaptive_icon_foreground_inset: 12
  remove_alpha_ios: true

flutter:
  generate: true
  uses-material-design: true
