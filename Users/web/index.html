<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="trtripsathi_mobile">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>trtripsathi_mobile</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #0d9488; }
    #app-loading { position: fixed; inset: 0; display: grid; place-items: center; color: white; font-family: Arial, sans-serif; background: linear-gradient(135deg, #064e4a, #0d9488, #2dd4bf); }
    .brand { text-align: center; animation: rise .7s ease-out both; }
    .mark { width: 88px; height: 88px; margin: auto; display: grid; place-items: center; border-radius: 28px; background: white; color: #0d9488; font-size: 48px; box-shadow: 0 18px 40px #0003; }
    .brand h1 { margin: 22px 0 5px; font-size: 32px; }
    .brand p { margin: 0; opacity: .82; }
    @keyframes rise { from { opacity: 0; transform: translateY(16px) scale(.94); } }
  </style>
</head>
<body>
  <div id="app-loading"><div class="brand"><div class="mark">⌖</div><h1>TripSathi</h1><p>Preparing your next journey…</p></div></div>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
