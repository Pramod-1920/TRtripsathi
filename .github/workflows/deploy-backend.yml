name: Deploy TripSathi Backend

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"

jobs:
  deploy:
    name: Deploy Backend to Oracle VPS
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Oracle VPS
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"

          for attempt in 1 2 3; do
            echo "Deployment attempt $attempt/3..."
            if timeout 30m ssh \
              -i "$HOME/.ssh/deploy_key" \
              -p "$DEPLOY_PORT" \
              -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=30 \
              -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=4 \
              "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<'EOF'; then
          set -e

          echo "================================="
          echo "Starting TripSathi deployment"
          echo "================================="

          cd /home/ubuntu/TRtripsathi/backend

          echo "Pulling latest code..."
          git fetch origin main
          git reset --hard origin/main

          echo "Installing dependencies..."
          npm ci

          echo "Building backend..."
          npm run build

          echo "Restarting PM2..."
          pm2 restart tripsathi-backend --update-env

          echo "Checking PM2 status..."
          pm2 status

          echo "Deployment completed successfully!"
          EOF
              echo "Deployment succeeded on attempt $attempt."
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Attempt $attempt failed. Retrying in 20 seconds..."
              sleep 20
            fi
          done

          echo "Deployment failed after 3 attempts."
          exit 1